# Debug TEE VM Configuration  
# Unencrypted volumes, debug image, SSH access preserved

vm:
  hostname: chutes-miner-debug-0
  base_image: "/var/lib/chutes/base-images/tdx-guest-debug/"  # Debug image-set dir (no encryption, SSH enabled); populated by `chutes-cvm image download --debug`
  vm_image_directory: ""  # Empty = /var/lib/chutes/vm-images/
  
miner:
  ss58: "5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY"
  seed: "your_seed_here"

# Optional Docker Hub auth (same as production). Helps avoid anonymous Hub rate limits during pulls/cosign.
# https://docs.docker.com/docker-hub/access-tokens/
# docker_hub:
#   username: "your_dockerhub_username"
#   token: "dckr_pat_xxxxxxxx"

network:
  vm_ip: "192.168.100.2"
  bridge_ip: "192.168.100.1/24"
  dns: "8.8.8.8"
  public_interface: "ens9f0np0"
  type: "tap"
  ssh_port: 2222

volumes:
  cache:
    size: "500G"  # Smaller for debug
    path: ""  # Auto-generate: cache-chutes-miner-debug-0.raw
  
  storage:
    size: "100G"  # Smaller for debug
    path: ""  # Auto-generate: storage-chutes-miner-debug-0.raw
    # Note: Debug VMs use UNENCRYPTED storage volume
    # Do not mix debug and production storage volumes!
  
  config:
    path: ""  # Auto-generate: config-chutes-miner-debug-0.qcow2

devices:
  bind_devices: true

runtime:
  foreground: false
