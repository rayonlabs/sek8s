name: Version Tag

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

jobs:
  version-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for PR diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.sha }}

      - name: Verify VERSION bumps
        if: github.base_ref == 'main' || github.event_name == 'push'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          changed_files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if [ -z "$changed_files" ]; then
            echo "No file changes in range; skipping VERSION check."
            exit 0
          fi

          errors=0

          # --- VM image domain ---
          # ansible/guest/* (guest image build), src/sek8s/*, src/sek8s-common/*, nvevidence/*,
          # root pyproject.toml, poetry.lock  →  ansible/guest/VERSION
          # ansible/host/* is bare-metal ops only — not baked into the guest image.
          needs_vm_bump=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              ansible/guest/*|src/sek8s/*|src/sek8s-common/*|nvevidence/*) needs_vm_bump=true; break ;;
              pyproject.toml|poetry.lock) needs_vm_bump=true; break ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_vm_bump" = true ]; then
            if ! echo "$changed_files" | grep -qx "ansible/guest/VERSION"; then
              echo "::error::Changes in the VM image domain (ansible/guest/, src/sek8s/, src/sek8s-common/, nvevidence/, root pyproject/lock) require an ansible/guest/VERSION bump."
              errors=$((errors + 1))
            else
              echo "VM domain: ansible/guest/VERSION bumped."
            fi
          else
            echo "No VM-domain changes detected."
          fi

          # --- Attestation-proxy domain ---
          # src/attestation-proxy/*  →  src/attestation-proxy/VERSION
          needs_proxy_bump=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/attestation-proxy/*) needs_proxy_bump=true; break ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_proxy_bump" = true ]; then
            if ! echo "$changed_files" | grep -qx "src/attestation-proxy/VERSION"; then
              echo "::error::Changes under src/attestation-proxy/ require an src/attestation-proxy/VERSION bump."
              errors=$((errors + 1))
            else
              echo "Proxy domain: src/attestation-proxy/VERSION bumped."
            fi
          else
            echo "No proxy-domain changes detected."
          fi

          # --- chutes-cvm domain ---
          # src/chutes-cvm/*  →  src/chutes-cvm/VERSION
          needs_cvm_bump=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/chutes-cvm/*) needs_cvm_bump=true; break ;;
            esac
          done <<< "$changed_files"

          if [ "$needs_cvm_bump" = true ]; then
            if ! echo "$changed_files" | grep -qx "src/chutes-cvm/VERSION"; then
              echo "::error::Changes under src/chutes-cvm/ require an src/chutes-cvm/VERSION bump."
              errors=$((errors + 1))
            else
              echo "chutes-cvm domain: src/chutes-cvm/VERSION bumped."
            fi
          else
            echo "No chutes-cvm-domain changes detected."
          fi

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify changelogs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "PR to main: strict check — no fragments allowed."
            python scripts/promote_changelogs.py --check --strict
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR to release branch: verifying branch-named fragments for changed components."
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$base" "$head" | \
              python scripts/promote_changelogs.py --check-branch "${{ github.head_ref }}"
          else
            echo "Push to main: strict check — no fragments allowed."
            python scripts/promote_changelogs.py --check --strict
          fi

  pyproject-sync-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify VERSION ↔ pyproject.toml sync
        run: python scripts/sync_pyproject_versions.py --check

  tag-version:
    needs: [version-check, pyproject-sync-check]
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tags for bumped versions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_if_ready() {
            local version_file="$1" prefix="$2" changelog_dir="$3"
            local version
            version=$(tr -d '[:space:]' < "$version_file")
            [ -z "$version" ] && return

            local tag="${prefix}${version}"

            if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
              echo "Tag $tag already exists; skipping."
              return
            fi

            if [ -z "$changelog_dir" ]; then
              git tag "$tag"
              git push origin "$tag"
              echo "Created tag $tag (no changelog tracked)."
              return
            fi

            local changelog="${changelog_dir}/CHANGELOG.md"
            if grep -qE "^## \\[${version}\\]" "$changelog" 2>/dev/null; then
              git tag "$tag"
              git push origin "$tag"
              echo "Created tag $tag"
            else
              echo "::warning::Tag $tag deferred: no ## [$version] heading in $changelog"
            fi
          }

          tag_if_ready "ansible/guest/VERSION"          "v"                    "changelogs/vm"
          tag_if_ready "src/sek8s/VERSION"             "sek8s-v"             "changelogs/sek8s"
          tag_if_ready "src/sek8s-common/VERSION"      "sek8s-common-v"      ""
          tag_if_ready "src/attestation-proxy/VERSION"  "attestation-proxy-v" "changelogs/attestation-proxy"
          tag_if_ready "src/chutes-cvm/VERSION"         "chutes-cvm-v"        "changelogs/chutes-cvm"
