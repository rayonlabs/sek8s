---
# Staged base image download, maintenance, drain, shutdown, cutover, relaunch.
# Controller: chutes-miner, kubectl. chutes-miner --name comes from chutes_tee_server_name (group_vars/all.yml; override via tee_server_name in host_vars).
#
# Idempotency / cost: the playbook never hashes the multi-GB qcow2 to decide what
# to do. It asks the control plane (chutes-miner tee maintenance-status) whether
# each server needs the active upgrade window's target version; already-current
# hosts end immediately — no download, no hash. When an upgrade IS needed the new
# image SET (qcow2 + direct-boot artifacts + manifest.json) is fetched once into a
# staged directory and verified as a coherent unit against its manifest (via
# chutes_cvm.guest.image_set), which is then trusted at launch. So running with no
# --limit safely walks the whole fleet and only touches hosts behind.
#
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml
#
#   # Drain + promote image but skip relaunch (e.g. to run remediate-host.yml next):
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml \
#     -e relaunch_vm=false
#
#   # Force upgrade even when validator denies maintenance (e.g. sole_survivor):
#   ansible-playbook -i ../inventory/hosts.yml playbooks/upgrade-guest.yml \
#     -e force_upgrade=true

- name: Upgrade TDX guest base image
  hosts: td_hosts
  serial: 1
  gather_facts: true
  become: true
  vars:
    chutes_config_remote_path: "{{ sek8s_remote_host_tools }}/scripts/config.yaml"
    relaunch_vm: true
    force_upgrade: false
  pre_tasks:
    - name: Require chutes_hotkey_path
      ansible.builtin.assert:
        that:
          - chutes_hotkey_path is defined
          - chutes_hotkey_path | length > 0
        fail_msg: "Set chutes_hotkey_path (e.g. group_vars or host_vars)."

  roles:
    - role: host_tools

  tasks:
    # Idempotency without hashing the multi-GB image: ask the control plane which
    # version each server runs and whether it needs the active upgrade window's
    # target. Already-current hosts end here — no API churn, no download, no hash.
    - name: Query TEE maintenance status (per-server versions)
      ansible.builtin.command:
        argv:
          - chutes-miner
          - tee
          - maintenance-status
          - --hotkey
          - "{{ chutes_hotkey_path }}"
          - --raw-json
      delegate_to: localhost
      become: false
      register: _maint_status
      changed_when: false

    - name: Resolve this host's server record from maintenance status
      ansible.builtin.set_fact:
        _server_record: >-
          {{ (_maint_status.stdout | from_json).servers
             | selectattr('name', 'equalto', chutes_tee_server_name)
             | list | first | default({}) }}
        _target_version: >-
          {{ (_maint_status.stdout | from_json).active_window.target_measurement_version
             | default('') }}

    - name: Report upgrade decision
      ansible.builtin.debug:
        msg: >-
          {{ chutes_tee_server_name }}: version={{ _server_record.version | default('unknown') }},
          target={{ _target_version | default('?') }},
          needs_upgrade={{ _server_record.needs_upgrade | default('unknown (server not found)') }}

    # Skip only when the control plane explicitly says this server does not need
    # the upgrade. If the server is missing from the response (needs_upgrade
    # undefined), fall through and upgrade rather than silently skipping.
    - name: End host when already at the target version
      ansible.builtin.meta: end_host
      when:
        - _server_record.needs_upgrade is defined
        - not (_server_record.needs_upgrade | bool)

    - name: Ensure base-images directory exists
      ansible.builtin.file:
        path: /var/lib/chutes/base-images
        state: directory
        mode: "0755"

    # Reached only for hosts the control plane flagged needs_upgrade (the no-op
    # ended the run above otherwise). Download the whole image set into a clean
    # staged directory and verify it as a coherent unit against its manifest
    # (chutes_cvm.guest.image_set verify --full re-hashes every file and exits non-zero
    # on any mismatch), replacing the old single-qcow2 aria2 --checksum pass.
    - name: Download the staged image set (qcow2 + boot artifacts + manifest) and verify
      ansible.builtin.shell: |
        set -euo pipefail
        dir="{{ upgrade_staged_dir }}"
        base="{{ upgrade_image_variant }}"
        url="{{ upgrade_r2_base_url }}"
        rm -rf "$dir"
        mkdir -p "$dir"
        for ext in qcow2 vmlinuz initrd cmdline; do
          aria2c -x 16 -s 16 -k 1M --allow-overwrite=true -d "$dir" -o "$base.$ext" "$url/$base.$ext"
        done
        aria2c -x 16 -s 16 -k 1M --allow-overwrite=true -d "$dir" -o "manifest.json" "$url/$base.manifest.json"
        chutes-cvm image verify --full "$dir"
      args:
        executable: /bin/bash
      register: staged_dl
      changed_when: true

    - name: Drain pods and shut down guest
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: drain_and_shutdown.yml

    # Lightweight existence check only (get_checksum: false) so the backup step
    # below is a no-op on a host that has no current base image set yet.
    - name: Stat current default base image set
      ansible.builtin.stat:
        path: "{{ upgrade_default_base_image }}"
        get_checksum: false
      register: cur_base_stat

    - name: Backup current base image set by date
      ansible.builtin.command:
        argv:
          - mv
          - "{{ upgrade_default_base_image }}"
          - "/var/lib/chutes/base-images/{{ upgrade_image_variant }}-{{ ansible_facts.date_time.date }}"
      when: cur_base_stat.stat.exists

    - name: Promote staged image set to default path
      ansible.builtin.command:
        argv:
          - mv
          - "{{ upgrade_staged_dir }}"
          - "{{ upgrade_default_base_image }}"

    - name: Relaunch VM and verify node health
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: launch_and_verify.yml
      when: relaunch_vm | bool
