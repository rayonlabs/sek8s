---
# Defaults for ansible/host operational playbooks.
# Adjacent to playbooks/ so Ansible loads this regardless of which inventory is used.
# Override any value in your inventory group_vars, host_vars, or with -e.

# TEE server name passed to chutes-miner --name flags.
# Defaults to inventory_hostname; set tee_server_name in host_vars to override (e.g. SSH alias differs from registered name).
chutes_tee_server_name: "{{ tee_server_name | default(inventory_hostname) }}"

sek8s_remote_root: /opt/sek8s
sek8s_remote_host_tools: "{{ sek8s_remote_root }}/host-tools"

sek8s_repo_url: https://github.com/chutesai/sek8s
sek8s_repo_branch: release/next

# PCCS (setup only) — set BOTH or omit BOTH via inventory / Vault / -e.
# pccs_api_key: ""
# pccs_password: ""

pccs_config_path: /opt/intel/sgx-dcap-pccs/config/default.json
pccs_ssl_dir: /opt/intel/sgx-dcap-pccs/ssl_key

chutes_validator_api: "https://api.chutes.ai"

# The base image is a published image SET (qcow2 + direct-boot .vmlinuz/.initrd/.cmdline
# + manifest.json), verified as a coherent unit via chutes_cvm.guest.image_set. R2 serves the
# set under the canonical variant name; the local set lives in a per-variant directory.
upgrade_r2_base_url: "https://vm.chutes.ai"
upgrade_image_variant: tdx-guest
upgrade_default_base_image: /var/lib/chutes/base-images/tdx-guest       # image-set directory
upgrade_staged_dir: /var/lib/chutes/base-images/tdx-guest.staged
upgrade_chute_label: "chutes/chute=true"
upgrade_drain_timeout: 600s
upgrade_drain_timeout_seconds: 600
upgrade_powerdown_timeout_seconds: 300
upgrade_health_poll_seconds: 900
# Max seconds to wait for a host to come back on SSH after a reboot triggered to
# clear a wedged GPU/PCI passthrough subsystem before launching the VM. These
# large-memory TDX/GPU hosts spend a long time in POST/memory-training and have
# been observed to take >20 min to return on SSH, so this is set to 30 min.
upgrade_reboot_timeout_seconds: 1800

# OS upgrade path for upgrade-host.yml.
# Maps current Ubuntu version -> next supported version via do-release-upgrade.
# do-release-upgrade only supports sequential releases (no skipping non-LTS).
# To add a new hop, append an entry here.
os_upgrade_path:
  "25.10": "26.04"
  # 25.04 and 25.10 are EOL/unsupported waypoints — setup.yml has no profile for
  # either, so always run with -e target_version=26.04 from them.
  "25.04": "25.10"
