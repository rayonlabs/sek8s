---
# Bootstrap base image (if missing), render config.yaml on host, run `chutes-cvm guest launch`.
#
# Required (host_vars / group_vars / Vault):
#   chutes_miner_ss58, chutes_miner_seed — miner credentials for the guest config
#   chutes_hotkey_path                   — controller path to Bittensor hotkey JSON (for node-health poll)
#
# Optional:
#   chutes_config_remote_path — default {{ sek8s_remote_host_tools }}/scripts/config.yaml
#   chutes_vm_hostname — vm.hostname; default is inventory_hostname
#   chutes_guest_bridge_network — e.g. 192.168.50.0/24; default picks a /24 that does not overlap host IPv4
#   chutes_public_interface — override default-route NIC used for the guest bridge
#   chutes_docker_hub_username / chutes_docker_hub_token — optional docker_hub block
#
# On checksum mismatch for an existing image, launch fails with an explicit message pointing to upgrade-guest.yml.
# If a chutes-td QEMU guest is already running, launch fails immediately; use playbooks/shutdown.yml first.

- name: Launch TDX guest VM
  hosts: td_hosts
  gather_facts: true
  become: true
  vars:
    chutes_config_remote_path: "{{ sek8s_remote_host_tools }}/scripts/config.yaml"

  pre_tasks:
    - name: Require chutes_hotkey_path
      ansible.builtin.assert:
        that:
          - chutes_hotkey_path is defined
          - chutes_hotkey_path | length > 0
        fail_msg: "Set chutes_hotkey_path in inventory or Vault."

    - name: Verify host clock is NTP-synchronized before launch
      # VMs inherit the host RTC at QEMU boot time. If the host clock is skewed,
      # any mTLS certificates generated inside the guest before NTP starts will
      # carry wrong timestamps and be rejected by the attestation endpoint.
      # Fail here so the operator knows to run setup.yml first.
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v chronyc &>/dev/null; then
          echo "FAIL: chrony not installed — run playbooks/setup.yml first" >&2
          exit 1
        fi
        # chronyc tracking returns non-zero when not synced
        offset=$(chronyc tracking 2>/dev/null | awk '/^System time/ {print $4}')
        if [ -z "$offset" ]; then
          echo "FAIL: chrony is not currently tracking a source" >&2
          exit 1
        fi
        # Fail if offset > 5 seconds (absolute value)
        python3 -c "
        import sys
        offset = float('$offset')
        if abs(offset) > 5:
            print(f'FAIL: clock offset {offset:+.3f}s exceeds 5s threshold', file=sys.stderr)
            sys.exit(1)
        print(f'OK: clock offset {offset:+.3f}s')
        "
      args:
        executable: /bin/bash
      register: clock_check
      changed_when: false

    - name: Display clock sync result
      ansible.builtin.debug:
        msg: "{{ clock_check.stdout }}"

    - name: Refuse launch while a chutes-td guest is already running
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: assert_not_running.yml

  roles:
    - role: host_tools
    - role: host_prerequisites

  tasks:
    - name: Launch VM (download image if missing, render config, run chutes-cvm guest launch)
      ansible.builtin.include_role:
        name: chutes_tee_vm
        tasks_from: launch_and_verify.yml
