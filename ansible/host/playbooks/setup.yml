---
# Host prep through TDX setup, optional PCCS, prerequisites. Does not launch the VM.
# Run from repo root or ansible/host:
#   ansible-playbook -i ../inventory/hosts.yml playbooks/setup.yml
#
# Optional Vault / extra-vars for automated PCCS:
#   pccs_api_key, pccs_password — set **both** to run roles/pccs_configure; omit both to skip (playbook prints why).
#   Partial configuration fails with an explicit inventory message.

- name: TDX host setup
  hosts: td_hosts
  gather_facts: true
  become: true
  vars:
  # Thin orchestration around the CLI: host_tools bootstraps `chutes-cvm` (installs it + its fetch
  # deps), tdx_bootstrap runs `chutes-cvm host setup` (which now owns the complete per-host config —
  # packages incl. chrony/aria2/xfsprogs, NTP, kernel/GRUB, driver blacklist, QGS/QCNL, kvm group,
  # /var/lib/chutes dirs) then handles the reboot + TDX-init verify, and pccs_configure applies the
  # vault-held PCCS secrets. The former ntp / host_prerequisites / chutes_dirs roles are folded into
  # host setup.
  roles:
    - role: host_tools
    - role: tdx_bootstrap
    - role: pccs_configure
