---
- name: Run host setup (idempotent — installs packages, kernel, PPAs, tools)
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - host
      - setup
      - "--noninteractive"
  register: setup_tdx
  changed_when: setup_tdx.rc == 0

- name: Check if reboot is required (apt flag)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Check if running kernel matches GRUB saved entry
  ansible.builtin.shell: |
    set -euo pipefail
    running=$(uname -r)
    grub_entry=$(grub-editenv /boot/grub/grubenv list 2>/dev/null | grep '^saved_entry=' || true)
    if [ -n "$grub_entry" ] && ! echo "$grub_entry" | grep -qF "$running"; then
      echo "mismatch"
    else
      echo "match"
    fi
  args:
    executable: /bin/bash
  register: kernel_grub_check
  changed_when: false

- name: Set reboot trigger fact
  ansible.builtin.set_fact:
    tdx_reboot_needed: >-
      {{ reboot_required.stat.exists
         or kernel_grub_check.stdout | trim == 'mismatch' }}

- name: Reboot host and wait
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: tdx_reboot_needed | bool

- name: Re-check dmesg for TDX after reboot
  ansible.builtin.shell: dmesg | grep -i tdx || true
  args:
    executable: /bin/bash
  register: tdx_after_reboot
  changed_when: false
  when: tdx_reboot_needed | bool

- name: Capture dmesg for TDX check
  ansible.builtin.shell: dmesg | grep -i tdx || true
  args:
    executable: /bin/bash
  register: tdx_dmesg_current
  changed_when: false
  when: not tdx_reboot_needed | bool

- name: Set TDX dmesg fact after reboot
  ansible.builtin.set_fact:
    tdx_final_dmesg: "{{ tdx_after_reboot.stdout }}"
  when: tdx_reboot_needed | bool

- name: Set TDX dmesg fact without reboot
  ansible.builtin.set_fact:
    tdx_final_dmesg: "{{ tdx_dmesg_current.stdout }}"
  when: not tdx_reboot_needed | bool

- name: Fail if TDX not initialized
  ansible.builtin.fail:
    msg: >-
      TDX does not appear initialized (neither 'tdx: TDX module initialized' nor
      'virt/tdx: module initialized' found in dmesg). See host-tools/README.md.
  when:
    - "'tdx: TDX module initialized' not in tdx_final_dmesg"
    - "'virt/tdx: module initialized' not in tdx_final_dmesg"
