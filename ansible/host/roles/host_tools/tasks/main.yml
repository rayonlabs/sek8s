---
# The chutes-cvm package's own install.sh is the single source of truth for fetch + install.
# We stage it from the control-node checkout and run it on the host: it sparse shallow-fetches
# host-tools/ + firmware/ + src/chutes-cvm/ into {{ sek8s_remote_root }} and editable-installs the
# CLI (+ the bundled nvidia-gpu-tools) into a venv on PATH — so a later `git pull` updates the code
# with no reinstall, and every later role/playbook has `chutes-cvm` (with its deps) available.
# Runs before tdx_bootstrap so `chutes-cvm host setup` works, and self-ensures its own install
# prerequisites (venv/pip + git for the fetch) so it holds without a separate host_prerequisites
# step — setup.yml no longer runs one (host setup installs the host operational deps itself).

- name: Ensure the chutes-cvm install prerequisites are present (venv/pip + git for the fetch)
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
      - git
    state: present
    update_cache: false

- name: Stage the chutes-cvm install script on the host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../src/chutes-cvm/install.sh"
    dest: /tmp/chutes-cvm-install.sh
    mode: "0755"

- name: Fetch + editable-install chutes-cvm via its install.sh (single source of truth)
  ansible.builtin.command:
    argv:
      - /tmp/chutes-cvm-install.sh
      - --dest
      - "{{ sek8s_remote_root }}"
      - --editable
      - --ref
      - "{{ sek8s_repo_branch | default('main') }}"
  environment:
    SEK8S_REPO: "{{ sek8s_repo_url }}"
  register: _chutes_cvm_install
  changed_when: "'Installed chutes-cvm' in _chutes_cvm_install.stdout"
