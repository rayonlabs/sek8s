---
# Set to true to automatically put the server into maintenance, drain all
# chute pods, and shut down the VM before upgrading. When false (default),
# the playbook fails if a TEE guest is detected running so the operator
# must shut it down manually first to avoid score impact.
#
# Override in inventory host_vars/group_vars or with -e auto_drain_vm=true.
auto_drain_vm: true

# Set to true (default) to automatically relaunch the VM and poll node-health
# after all upgrade hops complete. Set to false to leave the host upgraded but
# the VM stopped (e.g. for maintenance or manual inspection).
relaunch_vm: true

# PCCS install root and the location its artifacts (config/, ssl_key/) are
# backed up to across a hop that must remove sgx-dcap-pccs (see pre_2510.yml
# and the restore step in hop.yml). The backup lives under /var/backups so it
# survives the do-release-upgrade reboot.
pccs_install_dir: /opt/intel/sgx-dcap-pccs
pccs_upgrade_backup_dir: /var/backups/sek8s/pccs
