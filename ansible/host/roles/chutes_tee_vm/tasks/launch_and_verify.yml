---
# Render config, start the VM via `chutes-cvm guest launch`, and wait for node-health.
# Used by upgrade-guest.yml and upgrade-host.yml after the guest has been shut down.
#
# Expects (from caller scope or vars):
#   chutes_tee_server_name        — TEE server name registered with chutes-miner
#   chutes_hotkey_path            — controller path to Bittensor hotkey JSON
#   chutes_miner_api              — miner API URL
#   chutes_config_remote_path     — path to config.yaml on the remote host
#   upgrade_health_poll_seconds   — seconds to poll node-health before giving up

- name: Render config.yaml on host before launch
  ansible.builtin.include_role:
    name: chutes_vm_config

# ── Image-set pre-flight ─────────────────────────────────────────────────────
# Launch is decoupled from download: the image set must already be staged (by
# upgrade-guest.yml, or `chutes-cvm image download`). We do NOT auto-download here — a
# missing set is an explicit failure with a remediation hint, not a silent fetch.
# When present, verify it is coherent against its manifest (chutes_cvm.guest.image_set
# resolve — presence/size, cheap, the bytes were fully hashed when staged) so a stale or
# out-of-sync set fails here with a clear message rather than cryptically inside chutes-cvm guest launch.

- name: Check the base image set exists
  ansible.builtin.stat:
    path: "{{ upgrade_default_base_image }}"
    get_checksum: false
  register: _base_img_stat

- name: Fail clearly when the base image set is missing
  ansible.builtin.fail:
    msg: >-
      Base image set not found at {{ upgrade_default_base_image }}. Launch does not
      auto-download — stage it first with `upgrade-guest.yml` or
      `chutes-cvm image download` (populates the set + manifest), then relaunch.
  when: not (_base_img_stat.stat.exists and _base_img_stat.stat.isdir)

- name: Verify the base image set against its manifest
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - image
      - verify
      - "{{ upgrade_default_base_image }}"
  register: _image_set_resolve
  changed_when: false
  failed_when: _image_set_resolve.rc != 0

# ── PCI passthrough wedge guard ──────────────────────────────────────────────
# GPU passthrough hosts occasionally wedge the PCI subsystem: a vfio-pci unbind
# or nvidia-gpu-tools task gets stuck in uninterruptible D-state, after which any
# SBR/CC-mode op (and therefore VM launch) fails with "SBR cannot run until the
# host is rebooted". Only a reboot clears it. We detect this up front, and again
# if the launch itself wedges the host, rebooting and waiting for SSH to return
# before (re)trying the launch. chutes_cvm.vfio.pci_operations_wedged() is the
# same predicate chutes-cvm guest launch uses internally (scans ps for D-state vfio/gpu-tools).

- name: Pre-flight — detect a wedged PCI subsystem
  ansible.builtin.command:
    argv:
      - chutes-cvm
      - host
      - vfio-wedged
  register: _pci_wedged
  failed_when: false
  changed_when: false

# Forced (SysRq) reboot, not a graceful one: a wedged subsystem hangs
# systemd-shutdown on the un-killable D-state tasks and the host never reboots.
- name: Force-reboot host to clear wedged PCI subsystem (pre-flight)
  ansible.builtin.include_tasks: force_reboot.yml
  when: _pci_wedged.rc == 0

- name: Launch VM (reboot and retry once if the launch wedges the PCI subsystem)
  block:
    - name: Launch VM via chutes-cvm guest launch
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - guest
          - launch
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch
      changed_when: true
  rescue:
    # Authoritative signal: the D-state tasks that wedge the PCI subsystem persist
    # until reboot, so re-running the predicate after the failure tells us directly
    # whether a reboot would help. Fall back to matching chutes-cvm guest launch's error text.
    - name: Re-check PCI wedge state after launch failure
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - host
          - vfio-wedged
      register: _post_wedge
      failed_when: false
      changed_when: false

    - name: Classify launch failure (recoverable PCI wedge vs. other)
      ansible.builtin.set_fact:
        _launch_pci_wedged: >-
          {{ (_post_wedge.rc == 0) or
             ('wedged' in (_qlaunch.stderr | default(''))) or
             ('SBR cannot run' in (_qlaunch.stderr | default(''))) or
             ('may need host reboot' in (_qlaunch.stdout | default(''))) }}

    - name: Fail when the launch error is not a recoverable PCI wedge
      ansible.builtin.fail:
        msg: >-
          chutes-cvm guest launch failed (rc={{ _qlaunch.rc | default('?') }}) for a reason
          other than a PCI wedge — not retrying. stderr={{ _qlaunch.stderr | default('') }}
      when: not (_launch_pci_wedged | bool)

    # Forced (SysRq) reboot — see force_reboot.yml. A graceful reboot here is
    # exactly what hangs the host in systemd-shutdown on the wedged D-state tasks.
    - name: Force-reboot host to clear wedged PCI subsystem (post-launch)
      ansible.builtin.include_tasks: force_reboot.yml

    - name: Retry VM launch after reboot
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - guest
          - launch
          - "{{ chutes_config_remote_path }}"
      register: _qlaunch_retry
      changed_when: true
      failed_when: false

    - name: Fail if launch still fails after reboot
      ansible.builtin.fail:
        msg: >-
          chutes-cvm guest launch still failing after a reboot to clear the PCI wedge
          (rc={{ _qlaunch_retry.rc }}). stderr={{ _qlaunch_retry.stderr | default('') }}
      when: _qlaunch_retry.rc != 0

- name: Poll node health until VM is registered and healthy
  ansible.builtin.command:
    argv:
      - chutes-miner
      - tee
      - node-health
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
  register: _health_poll
  until: _health_poll.rc == 0
  retries: "{{ [((upgrade_health_poll_seconds | int) // 30), 1] | max }}"
  delay: 30

- name: Unlock server to resume gepetto scheduling
  ansible.builtin.command:
    argv:
      - chutes-miner
      - unlock
      - --name
      - "{{ chutes_tee_server_name }}"
      - --hotkey
      - "{{ chutes_hotkey_path }}"
      - --miner-api
      - "{{ chutes_miner_api }}"
  delegate_to: localhost
  become: false
