---
# Rendered into host config.yaml (override in group_vars / host_vars / Vault).

# Set to a non-empty path to override the default base image location used by host-tools.
chutes_vm_base_image: ""

# Set to a non-empty path to override the default per-VM image directory (else /var/lib/chutes/vm-images).
chutes_vm_image_directory: ""

chutes_network_dns: "8.8.8.8"
chutes_volume_cache_size: "10000G"
chutes_volume_cache_path: "/data/prod/cache.raw"
chutes_volume_storage_size: "500G"
chutes_volume_storage_path: "/data/prod/storage.raw"
chutes_volume_config_path: "/data/prod/config.qcow2"
chutes_devices_bind: true
chutes_runtime_foreground: false

# If set (e.g. "192.168.50.0/24"), skip pick_guest_network.py and use .2 / .1/24 on this prefix.
# chutes_guest_bridge_network: ""

# Override detected default-route interface if needed.
# chutes_public_interface: "ens192"
