---
- name: Confirm guest image build configuration
  hosts: host
  become: false
  tags:
    - always
  tasks:
    - name: Output build configuration
      ansible.builtin.debug:
        msg:
          - "Build env: {{ build_env }}"
          - "VM version: {{ vm_version }}"
          - "Debug build: {{ debug_build | default(false) }}"
          - "Final image: {{ final_img_path }}"

    - name: Confirm intended build before starting VM
      ansible.builtin.pause:
        prompt: >-
          Is this the intended build? The next step launches the TDX guest VM toward this output path.
          Press Enter to continue, or Ctrl+C to abort.

    # The root RSA PUBLIC key is baked into the image and measured into RTMR3, so every build
    # (ours and third-party reproductions) must use the SAME key. Fetch it from R2 once here, before
    # any consumer (chutes-gpu verifies the helm key against it; signing-keys bakes it). Published
    # to R2 from KMS out-of-band in chutes-ops (make export-signing-keys && make publish-signing-key).
    # A wrong/missing key fails the build here rather than as an opaque RTMR3 mismatch later.
    - name: Fetch root signing public key from R2
      ansible.builtin.get_url:
        url: "{{ root_signing_key_url }}"
        dest: "{{ root_signing_key_path }}"
        mode: "0644"
        force: true

    - name: Verify the fetched root key is a valid RSA public key
      ansible.builtin.command: "openssl pkey -pubin -in {{ root_signing_key_path }} -noout"
      changed_when: false

- name: Run TDX guest image
  hosts: host
  become: true
  tags:
    - run-vm
    - always
  handlers:
    - name: Global handlers
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../handlers/main.yml"
  tasks:
    # Install the chutes-cvm CLI from THIS checkout (editable venv + PATH shim) so the
    # build's `chutes-cvm` calls (measurements/image, here and in capture-ccel)
    # run the code being built and get the package's deps. Runs once; the console script
    # is then on PATH for every later play.
    - name: Install the chutes-cvm CLI from this checkout
      ansible.builtin.command:
        cmd: "{{ repo_root }}/src/chutes-cvm/install.sh"
      register: _cvm_install
      changed_when: "'Installed chutes-cvm' in _cvm_install.stdout"

    - name: Include run TDX vm role
      ansible.builtin.include_role:
        name: run-vm

