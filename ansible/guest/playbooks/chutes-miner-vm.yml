# The whole measurement phase — gather-measurement-inputs + compute-measurements +
# image-manifest — is generated by the fork entirely OFFLINE (no TDX hardware) and cheap, so
# it always runs as part of a full build. There's no on/off variable and no per-profile
# selection: it generates every profile (pending ones self-skip). Every register (mrtd + rtmr0
# + rtmr1/2 + rtmr3) is computed POST-luks in one `build` call below, since the CLI unlocks the
# encrypted root with LUKS_PASSPHRASE to read RTMR3's userspace files. To build the image
# WITHOUT measurements (e.g. non-Docker or fast local dev iteration), run `--tags build`, or
# `--skip-tags compute-measurements` — the whole chain shares the `compute-measurements` tag.
- name: Prepare boot image (encrypt + measured initramfs for prod / install debug initramfs)
  hosts: host
  become: true
  tags:
    - prepare-boot-image
    - build
  handlers:
    - name: Global handlers
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../handlers/main.yml"
  tasks:
    - name: Prepare boot image
      ansible.builtin.include_role:
        name: prepare-boot-image
        apply:
          tags: prepare-boot-image

# ── Measurement GATHER (post-boot-image) ──────────────────────────────────────
# The initrd is now final (prepare-boot-image rebuilt it for prod AND debug). Stage this image's
# direct-boot vmlinuz/initrd/cmdline — RTMR1/2 measure these exact bytes.
#
# There is NO CCEL capture in this build flow: the tdx-measure fork self-generates the
# complete RTMR0 offline, so the build needs no TDX hardware. The `capture-ccel` role is
# retained on disk as a STANDALONE tool (for the occasional debug / new-CPU-gen cross-
# check against a real quote — include it from a one-off playbook when needed), but it is
# deliberately not part of the build: the fork is the source of truth, and the runtime
# attestation match is the ongoing guarantee.
- name: Gather measurement inputs from final image (post-luks)
  hosts: host
  become: true
  tags:
    - gather-measurement-inputs
    - compute-measurements
  tasks:
    - name: Stage direct-boot artifacts
      ansible.builtin.include_role:
        name: stage-boot-artifacts

# ── Measurement COMPUTE (post-luks) ───────────────────────────────────────────
# `chutes-cvm measurements generate` computes EVERY register in one call — mrtd + RTMR0
# (per-topology, the fork) + RTMR1/RTMR2 (the staged direct-boot artifacts) + RTMR3 (mounting the
# root, unlocked with LUKS_PASSPHRASE) — writing the version's single measurements.yaml.
# tdx-measure builds the shared fork engine. All offline (no TDX/GPU).
- name: Compute measurements from gathered inputs (post-luks)
  hosts: host
  become: true
  tags:
    - compute-measurements
  tasks:
    - name: Provision the tdx-measure fork (RTMR0/1/2 engine)
      ansible.builtin.include_role:
        name: tdx-measure

    - name: Build the full measurements.yaml (mrtd + rtmr0 all topologies + rtmr1/2 + rtmr3)
      ansible.builtin.command:
        argv:
          - chutes-cvm
          - measurements
          - generate
          - --version
          - "{{ vm_version }}"
          - --image
          - "{{ final_img_path }}"
          - --output
          - "{{ repo_root }}/measurements/{{ vm_version }}{{ '-debug' if debug_build | default(false) else '' }}/measurements.yaml"
          - --tdx-measure-bin
          - "{{ tdx_measure_bin | default('tdx-measure') }}"
          # Source of the known host classes + their fingerprints (the build host must reach it).
          - --api-base
          - "{{ measurements_api_base | default('https://api.chutes.ai') }}"
          # This build is the measurement generator, so it processes the full queue — including
          # host classes awaiting generation (a newly submitted profile is 'pending' until its
          # measurement exists here). Third-party verification runs omit this and see measured only.
          - --include-pending
      environment:
        # RTMR3 mounts the root; LUKS_PASSPHRASE unlocks it when the image is encrypted (prod).
        LUKS_PASSPHRASE: "{{ luks_passphrase | default('') }}"
        # The tdx-measure fork shells out to `docker build` for offline ACPI generation;
        # extend PATH so it is found even under snap or a minimal inherited PATH.
        PATH: "{{ lookup('env', 'PATH') }}:/usr/local/bin:/usr/bin:/snap/bin"
      register: _measurements_build
      changed_when: _measurements_build.rc == 0

    - name: Show measurements build output
      ansible.builtin.debug:
        var: _measurements_build.stderr_lines

- name: Stage the published image-set manifest
  hosts: host
  become: true
  tags:
    - image-manifest
    - compute-measurements
  tasks:
    # The publishable image is a SET: the finished qcow2 + its direct-boot artifacts + a
    # manifest.json tying them together, all in the set's own <env>/<version>[-debug]/
    # directory (so prod and debug never share a manifest, and the directory can be copied
    # straight into /var/lib/chutes/base-images/<variant>/ for testing). chutes_cvm.guest.image_set is the single manifest
    # generator (also used by publish and the launcher), so the schema never drifts.
    # Generated over the FINAL qcow2 so the recorded sha256 matches what miners
    # download, and for whichever variant this build produced (debug or prod) — so the
    # build (ansible) owns the published sha for both. Depends on the direct-boot sidecars
    # from stage-boot-artifacts, so it carries the `compute-measurements` tag too — a
    # `--skip-tags compute-measurements` skips the manifest with them.
    - name: Generate manifest.json for the finished image set
      ansible.builtin.command:
        chdir: "{{ repo_root }}/host-tools/scripts"
        argv: >-
          {{ ['chutes-cvm', 'image', 'manifest', final_img_path,
              '--version', vm_version]
             + (['--debug'] if (debug_build | default(false)) else []) }}
      changed_when: true

