---
- name: Restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: yes
  listen: restart k3s

- name: Restart containerd
  ansible.builtin.service:
    name: containerd
    state: restarted

- name: Restart timesyncd service
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: reload udev
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false
  failed_when: false

- name: update grub
  ansible.builtin.shell: mkdir -p /boot/grub && update-grub
  args:
    executable: /bin/bash

- name: update initramfs
  ansible.builtin.command:
    cmd: update-initramfs -u -k all

# Modular libvirt (virtqemud) on 24.04+, monolithic before it. Two handlers on a `listen` topic,
# not one named block — a block in a handlers file is not notifiable by name.
- name: Restart virtqemud if present (modular libvirt)
  ansible.builtin.systemd:
    name: virtqemud
    state: restarted
  failed_when: false
  register: virtqemud_restart
  listen: restart libvirtd

- name: Restart libvirtd (monolithic fallback)
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted
  when: virtqemud_restart is failed or virtqemud_restart.status is not defined
  failed_when: false
  listen: restart libvirtd
