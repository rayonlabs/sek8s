# ansible/guest/roles/admission-controller/defaults/main.yml

# OPA settings
opa_version: "1.15.2"

# cosign version — pinned for deterministic builds (fetching 'latest' at build time is non-deterministic).
# v2.6.3 is the last v2 security patch (fixes CVE-2026-39395). Project uses 'cosign verify --key'
# which is stable across v2 and v3; staying on v2 avoids any v3 bundle-format changes.
cosign_version: "2.6.3"
opa_log_level: "info"
# Per-decision logging (full AdmissionReview input → journal). OFF in prod: it is
# high-volume noise that evicts the boot/attestation history from the journal window,
# and it puts tenant pod specs into a log the miner can read via the status API.
# Debug builds can opt in with -e opa_decision_logs=true.
opa_decision_logs: false

# Admission controller settings
admission_bind_address: "127.0.0.1"
admission_port: 8443
# API server waits at most this long per validating webhook call (cosign/OPA). K8s caps at 30.
admission_webhook_timeout_seconds: 30
enforcement_mode: "enforce"
cache_enabled: true
cache_ttl: 300
debug_mode: false
metrics_enabled: true
# Registry allowlist
allowed_registries:
  - docker.io
  - gcr.io
  - quay.io
  - registry.k8s.io
  - rancher
  - nvcr.io
  - parachutes
  - "registry.chutes.ai"
