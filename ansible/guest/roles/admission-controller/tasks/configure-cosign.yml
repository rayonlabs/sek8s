- name: Configure cosign
  block:
    - name: Apply registry configuration
      ansible.builtin.template:
        src: cosign-registries.json.j2
        dest: /etc/admission-controller/cosign-registries.json
        owner: root
        group: root
        mode: '0644'
      notify: restart admission-controller

    - name: Create docker-config directory for DOCKER_CONFIG/cosign (config.json written at boot by config-manager)
      ansible.builtin.file:
        path: /etc/admission-controller/docker-config
        state: directory
        owner: root
        group: admission
        mode: '0750'

    - name: Create cosign directory for admission controller
      ansible.builtin.file:
        path: /etc/admission-controller/cosign
        state: directory
        owner: root
        group: admission
        mode: '0750'

    # registry.chutes.ai is a real, publicly-resolvable host reached over
    # genuine mTLS — no /etc/hosts loopback alias and no insecure-registries
    # entry are needed. The former localregistry.chutes.ai:30500 local-proxy
    # plumbing (127.0.0.1 hosts alias + insecure-registries in daemon.json) has
    # been removed now that pulls use per-VM mTLS to the upstream registry.