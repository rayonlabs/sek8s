# Image output env label (override in inventory); used in final_img_path below.
# The image SET lives in its own <env>/<version>[-debug]/ directory (qcow2 + direct-boot
# sidecars + manifest.json) — see playbooks/group_vars/host.yml.
build_env: "dev"
image_set_name: "{{ vm_version | default('0.0.0') }}{{ '-debug' if debug_build | default(false) else '' }}"
image_set_dir: "{{ img_dir }}/{{ build_env }}/{{ image_set_name }}"
final_img_path: "{{ image_set_dir }}/{{ image_set_name }}.qcow2"