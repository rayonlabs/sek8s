- name: Remove build-time dummy miner.env (config-manager writes real one from config volume at boot)
  ansible.builtin.file:
    path: /etc/system-manager/miner.env
    state: absent

# On /run (tmpfs) so it never reaches the image regardless, but remove it explicitly to
# match the miner.env pattern — the initramfs write-validator-auth script writes the real
# per-VM auth here on every boot.
- name: Remove build-time dummy validator-auth.env (initramfs writes real one at boot)
  ansible.builtin.file:
    path: /run/chutes/validator-auth.env
    state: absent

- name: Clean build artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/charts

- name: Remove orphaned SSH host keys (sshd already removed, keys are inert)
  ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
  args:
    removes: /etc/ssh/ssh_host_rsa_key
  when: not (debug_build | default(false))

- name: Truncate log files
  ansible.builtin.shell: find /var/log -type f -exec truncate -s 0 {} +
  changed_when: true

- name: Remove Ansible build-time facts cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/.ansible
    - /root/.ansible

- name: Clear shell history for all users
  ansible.builtin.shell: |
    find /home /root -maxdepth 2 -name '.*_history' -delete 2>/dev/null || true
    > /root/.bash_history
  changed_when: true

- name: Trim filesystem to reduce disk size
  ansible.builtin.command: fstrim -av
  register: fstrim_result
  changed_when: fstrim_result.rc == 0
  failed_when: false