---
# tdx-measure — Provision the virtee/tdx-measure fork binary on the build host.
#
# `chutes-cvm measurements generate` (RTMR0/1/2) needs the fork's CLI. This role clones it and always
# fast-forwards it to `tdx_measure_ref` from origin — so a build host never silently
# rebuilds a stale binary when the pinned branch moves — then builds it with cargo and
# sets the `tdx_measure_bin` fact. Runs in user space (invoke with become: false): rust
# toolchains and the build tree are per-user.
#
# To iterate on a local tdx-measure, set `tdx_measure_bin` to your own build — the whole
# provision block (clone/update + build) is skipped. Cloning the (private) fork needs git
# credentials; the default src dir is a sibling checkout of this repo.

- name: Provision tdx-measure from source (skipped when tdx_measure_bin is preset)
  when: (tdx_measure_bin | default('')) | length == 0
  # The clone + cargo build run in user space (per-user rust toolchain / build tree);
  # the apt install below opts back into root per-task.
  become: false
  # rustup's shims live in ~/.cargo/bin, which a non-login ansible shell need not have
  # on PATH — prepend it so `rustup`/`cargo` resolve to the rustup toolchain rather
  # than an apt cargo. Harmless when the dir is absent.
  environment:
    PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ lookup('env', 'PATH') }}"
  block:
    # This role is invoked become: false (the build tree is per-user), so the apt
    # install opts back into root per-task. git clones the fork; cargo builds it.
    - name: Ensure git is installed
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
      become: true

    # rustup, not apt, is the toolchain source for this build (build-setup.yml installs
    # it per build user; the sr25519 role requires it the same way). apt's cargo is
    # routinely too old for the fork's dependency tree — crates now ship edition2024,
    # which needs cargo >= 1.85, and Ubuntu's 1.84.1 dies at manifest parse ("feature
    # `edition2024` is required"). Requiring rustup here fails fast with a fix instead
    # of installing a cargo that cannot build the tree.
    - name: Detect rustup on the build user's PATH
      ansible.builtin.command: which rustup
      register: _tdxm_rustup
      changed_when: false
      failed_when: false

    - name: Require rustup (apt's cargo is too old to build the fork)
      ansible.builtin.fail:
        msg: >-
          rustup not found for {{ lookup('env', 'USER') | default('this account', true) }}
          (searched {{ lookup('env', 'HOME') }}/.cargo/bin). rustup is per-user —
          build-setup.yml installs it for build_user, so run the build as that account,
          or install it here:
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none.
          The tdx-measure fork's dependencies need cargo >= 1.85 (edition2024); apt ships
          1.84.1, which fails at manifest parse.
      when: _tdxm_rustup.rc != 0

    # build-setup.yml installs rustup with --default-toolchain none, so the shims exist
    # but no toolchain does; the fork pins none of its own (no rust-toolchain.toml), so
    # name one here and build under it explicitly. Idempotent — rustup no-ops when the
    # toolchain is already present. If the fork ever pins a toolchain, set
    # tdx_measure_toolchain to match it.
    - name: Ensure the tdx-measure toolchain is installed
      ansible.builtin.command:
        cmd: rustup toolchain install {{ tdx_measure_toolchain }} --profile minimal
      register: _tdxm_toolchain
      changed_when: "'installing' in _tdxm_toolchain.stderr"

    - name: Clone and fast-forward the tdx-measure fork to the pinned ref
      # update: true + force: true — always advance an existing checkout to
      # tdx_measure_ref, so a moved branch tip (e.g. an RTMR1/2 fix) can't leave a
      # build host rebuilding stale source into a wrong-measurement binary. Local
      # iteration is served by presetting tdx_measure_bin (skips this whole block),
      # so nothing here clobbers a dev's working tree.
      ansible.builtin.git:
        repo: "{{ tdx_measure_repo_url }}"
        dest: "{{ tdx_measure_src_dir }}"
        version: "{{ tdx_measure_ref }}"
        update: true
        force: true

    - name: Refuse to build a tdx-measure that is behind origin
      # Hard guarantee on top of the forced update: compiling a fork behind
      # origin/tdx_measure_ref silently produces WRONG RTMR measurements (this is
      # exactly how a stale RTMR1/2 shipped once). Fail the run instead of building
      # stale — HEAD must equal the remote tip.
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd "{{ tdx_measure_src_dir }}"
          git fetch --quiet origin "{{ tdx_measure_ref }}"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse FETCH_HEAD)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "STALE tdx-measure: HEAD $local_sha != origin/{{ tdx_measure_ref }} $remote_sha" >&2
            exit 1
          fi
          echo "tdx-measure at origin/{{ tdx_measure_ref }}: $local_sha"
      changed_when: false
      register: _tdxm_freshness

    - name: Show the verified tdx-measure commit
      ansible.builtin.debug:
        msg: "{{ _tdxm_freshness.stdout }}"

    - name: Build the tdx-measure CLI (release)
      ansible.builtin.command:
        cmd: cargo +{{ tdx_measure_toolchain }} build --release
        chdir: "{{ tdx_measure_src_dir }}/cli"
      changed_when: true

    - name: Point tdx_measure_bin at the freshly built binary
      ansible.builtin.set_fact:
        tdx_measure_bin: "{{ tdx_measure_src_dir }}/cli/target/release/tdx-measure"

- name: Report the tdx-measure binary in use
  ansible.builtin.debug:
    msg: "tdx-measure: {{ tdx_measure_bin | default('tdx-measure (PATH)') }}"
