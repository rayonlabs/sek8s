---
- name: Ensure /etc/chutes exists
  ansible.builtin.file:
    path: /etc/chutes
    state: directory
    mode: '0755'

- name: Fetch and verify Helm key from signing-keys API (runs on build host)
  ansible.builtin.shell: |
    set -euo pipefail

    # Expand ~ in root_signing_key_path (Ansible does not shell-expand tilde in strings)
    ROOT_KEY=$(eval echo "{{ root_signing_key_path }}")
    SIGNING_KEYS_URL="{{ validator_base_url }}/servers/signing-keys"

    [ -f "$ROOT_KEY" ] || { echo "ERROR: root signing key not found: $ROOT_KEY" >&2; exit 1; }

    BUNDLE=$(curl -sf --max-time 30 "$SIGNING_KEYS_URL") \
      || { echo "ERROR: failed to fetch key bundle from $SIGNING_KEYS_URL" >&2; exit 1; }

    KEY_B64=$(printf '%s' "$BUNDLE" | jq -r --arg k "helm-pubkey.gpg" '.keys[$k] // empty')
    SIG_B64=$(printf '%s' "$BUNDLE" | jq -r --arg k "helm-pubkey.gpg" '.signatures[$k] // empty')

    [ -n "$KEY_B64" ] || { echo "ERROR: helm-pubkey.gpg not in key bundle" >&2; exit 1; }
    [ -n "$SIG_B64" ] || { echo "ERROR: helm-pubkey.gpg signature not in bundle" >&2; exit 1; }

    TMPKEY=$(mktemp /tmp/helm-key.XXXXXXXX)
    TMPSIG=$(mktemp /tmp/helm-sig.XXXXXXXX)
    trap 'rm -f "$TMPKEY" "$TMPSIG"' EXIT

    printf '%s' "$KEY_B64" | base64 -d > "$TMPKEY"
    printf '%s' "$SIG_B64" | base64 -d > "$TMPSIG"

    openssl dgst -sha256 -verify "$ROOT_KEY" -signature "$TMPSIG" "$TMPKEY" >&2 \
      || { echo "ERROR: RSA signature verification FAILED for helm-pubkey.gpg" >&2; exit 1; }

    # Output verified key bytes as base64 for the follow-up copy task
    base64 -w0 < "$TMPKEY"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: _helm_key_b64
  changed_when: false

- name: Write verified Helm PGP key to VM temp path for chart install
  ansible.builtin.copy:
    content: "{{ _helm_key_b64.stdout | b64decode }}"
    dest: /tmp/build-helm-pubkey.gpg
    mode: '0600'

- name: Create Helm config directories for build-time and boot-time use
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ helm_config_home }}"
    - "{{ helm_cache_home }}"
    - "{{ helm_data_home }}"

- name: Add Chutes Helm repository to pre-configured Helm paths
  ansible.builtin.shell: |
    helm repo add chutes {{ chutes_helm_repo_url | quote }}
    helm repo update
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  args:
    executable: /bin/bash

- name: Generate Chutes values file
  ansible.builtin.template:
    src: chutes-values.yaml.j2
    dest: /tmp/chutes-values.yaml
    mode: '0644'
  when: (chutes_gpu_values | default({}) | length) > 0

- name: Install or upgrade Chutes GPU charts
  ansible.builtin.shell: |
    helm upgrade --install chutes chutes/chutes-miner-gpu \
      --namespace chutes \
      --create-namespace \
      {% if chutes_chart_version is defined and chutes_chart_version %}
      --version {{ chutes_chart_version | quote }} \
      {% endif %}
      --verify --keyring /tmp/build-helm-pubkey.gpg \
      --set-string minerCredentials.ss58Address="REPLACE_ME" \
      --set-string minerCredentials.secretSeed="REPLACE_ME" \
      {% if (chutes_gpu_values | default({}) | length) > 0 %}
      -f /tmp/chutes-values.yaml \
      {% endif %}
      --kubeconfig=/etc/rancher/k3s/k3s.yaml
  environment:
    HELM_CONFIG_HOME: "{{ helm_config_home }}"
    HELM_CACHE_HOME: "{{ helm_cache_home }}"
    HELM_DATA_HOME: "{{ helm_data_home }}"
  register: miner_deployment
  changed_when: miner_deployment.rc == 0
  no_log: true

- name: Remove build-time Helm keyring (not persisted in image)
  ansible.builtin.file:
    path: /tmp/build-helm-pubkey.gpg
    state: absent

- name: Display deployment result
  ansible.builtin.debug:
    msg: "Miner GPU deployment on {{ inventory_hostname }}: {{ 'SUCCESS' if miner_deployment.rc == 0 else 'FAILED' }}"

- name: Ensure chart specs directory exists
  ansible.builtin.file:
    path: /etc/chutes/charts
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: miner_deployment.rc == 0

# Single source of truth for the Chutes miner chart, reconciled at boot by
# 04-helm-chart-upgrade.sh and measured into RTMR3. Replaces the old
# chart-versions marker + chart-configs entry. VERSION comes from the
# chutes_chart_version var (pinned), not the live install, so the spec is
# reproducible and a bump is a deliberate var change.
- name: Install chutes-miner-gpu chart spec
  ansible.builtin.template:
    src: charts/chutes-miner-gpu.conf.j2
    dest: /etc/chutes/charts/chutes-miner-gpu.conf
    owner: root
    group: root
    mode: '0644'
  when: miner_deployment.rc == 0

- name: Delete dummy miner credentials
  kubernetes.core.k8s:
    name: miner-credentials
    api_version: v1
    kind: Secret
    namespace: chutes
    state: absent