---
# chute-log-shipper — standalone systemd service that discovers chute pods via
# the CRI socket, reads their logs off /var/log/pods, and ships them to the
# validator over mTLS. Mirrors the system-manager role's standalone-service
# pattern (dedicated non-root uid, restricted k3s wrapper, hardened unit).

- name: Ensure supplemental groups exist for chute-log-shipper
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: true
  loop:
    - systemd-journal
    - containerd  # k3s ctr/crictl socket access (socket chgrp'd by system-manager)

- name: Create chute-log-shipper group
  ansible.builtin.group:
    name: chute-log-shipper
    gid: "{{ chute_log_shipper_gid }}"
    state: present
    system: true

# Dedicated non-root uid (not 1000, not the system-manager uid 10150), per the
# system-manager isolation rule. Supplemental containerd grants CRI socket access;
# registry mTLS leaf access is layered on by the vm-tls role via a drop-in.
- name: Create chute-log-shipper user
  ansible.builtin.user:
    name: chute-log-shipper
    uid: "{{ chute_log_shipper_uid }}"
    group: chute-log-shipper
    groups: "systemd-journal,containerd"
    append: true
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: /opt/sek8s

- name: Create chute-log-shipper directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/chute-log-shipper, owner: root, group: chute-log-shipper, mode: '0750' }
    - { path: /var/lib/chute-log-shipper, owner: chute-log-shipper, group: chute-log-shipper, mode: '0750' }

- name: Deploy chute-log-shipper environment file
  ansible.builtin.template:
    src: chute-log-shipper.env.j2
    dest: /etc/chute-log-shipper/chute-log-shipper.env
    owner: root
    group: chute-log-shipper
    mode: '0640'

# Readable crictl config: the non-root service cannot read k3s's own root-only crictl.yaml.
- name: Deploy chute-log-shipper crictl config
  ansible.builtin.copy:
    src: crictl.yaml
    dest: /etc/chute-log-shipper/crictl.yaml
    owner: root
    group: chute-log-shipper
    mode: '0640'

- name: Install restricted crictl wrapper (read-only pods/ps JSON only)
  ansible.builtin.copy:
    src: crictl-pods-helper
    dest: /usr/local/bin/crictl-pods-helper
    owner: root
    group: root
    mode: '0755'

- name: Install chute-log-shipper service
  ansible.builtin.copy:
    src: chute-log-shipper.service
    dest: /etc/systemd/system/chute-log-shipper.service
    owner: root
    group: root
    mode: '0644'

- name: Create chute-log-shipper service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/chute-log-shipper.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy security hardening drop-in
  ansible.builtin.copy:
    src: chute-log-shipper.conf
    dest: /etc/systemd/system/chute-log-shipper.service.d/10-security.conf
    owner: root
    group: root
    mode: '0644'

- name: Enable chute-log-shipper service
  ansible.builtin.systemd:
    name: chute-log-shipper.service
    enabled: true
    daemon_reload: true
