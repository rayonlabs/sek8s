---
- name: Setup k3s networking
  ansible.builtin.include_tasks: k3s-networking.yml
  tags: k3s-networking

- name: Setup k3s prerequisites
  ansible.builtin.include_tasks: k3s-prereqs.yml
  tags: k3s-prereqs

- name: Setup k8s tooling
  ansible.builtin.include_tasks: k8s-tooling.yml
  tags: k8s-tooling

- name: Install helm
  ansible.builtin.include_tasks: helm.yml
  tags: helm

- name: Install k3s
  ansible.builtin.include_tasks: install.yml
  tags: k3s-install

- name: Setup node
  ansible.builtin.include_tasks: setup_node.yml
  tags: k3s-node

- name: Setup k3s pre-start service
  ansible.builtin.include_tasks: setup_pre_start.yml
  tags: k3s-pre-start

- name: Setup k3s post-start service
  ansible.builtin.include_tasks: setup_post_start.yml
  tags: k3s-post-start

- name: Setup graceful shutdown (logind drop-in)
  ansible.builtin.include_tasks: setup_graceful_shutdown.yml
  tags: k3s-graceful-shutdown

- name: Configure NVIDIA container runtime for K3s
  ansible.builtin.include_tasks: nvidia-runtime.yml
  tags: k3s-nvidia-runtime
  when: ansible_facts.packages['nvidia-container-toolkit'] is defined

- name: Setup seccomp profiles
  ansible.builtin.include_tasks: seccomp-profiles.yml
  tags: seccomp-profiles
