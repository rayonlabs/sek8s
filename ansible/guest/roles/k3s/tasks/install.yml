---
- name: Get k3s installed version
  ansible.builtin.command: k3s --version
  register: k3s_version_output
  changed_when: false
  ignore_errors: true

- name: Set k3s installed version
  when: not ansible_check_mode and k3s_version_output.rc == 0
  ansible.builtin.set_fact:
    installed_k3s_version: "{{ k3s_version_output.stdout_lines[0].split(' ')[2] }}"

# Download and install only if needed
- name: Download artifact only if needed
  when: not ansible_check_mode and (k3s_version_output.rc != 0 or installed_k3s_version is version(k3s_version, '<'))
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io/
        timeout: 120
        dest: /usr/local/bin/k3s-install.sh
        owner: root
        group: root
        mode: "0755"

    - name: Download K3s binary for single node
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s-install.sh
          - --write-kubeconfig-mode 600
          - --disable servicelb
          - --disable traefik
      environment:
        INSTALL_K3S_SKIP_START: "true"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      changed_when: true

# Unconditional (outside the version-gated block above): the script may be left over from an
# earlier run even when this build skipped the download.
#
# It is fetched unpinned from get.k3s.io and is only ever used to install k3s, but it lands in
# /usr/local/bin, which is measured wholesale into RTMR3 — so whatever upstream happened to be
# serving at build time became part of the image's measurements, and two builds minutes apart
# produced different RTMR2/RTMR3. Removing it makes the measurement independent of an unpinned
# remote fetch, and drops a network-sourced script from the shipped image. The k3s BINARY stays
# version-pinned via INSTALL_K3S_VERSION.
- name: Remove the k3s install script (unpinned upstream fetch, not needed at runtime)
  ansible.builtin.file:
    path: /usr/local/bin/k3s-install.sh
    state: absent

- name: Add K3s autocomplete to user bashrc
  when: ansible_user is defined
  ansible.builtin.lineinfile:
    path: ~{{ ansible_user }}/.bashrc
    regexp: \.\s+<\(k3s completion bash\)
    line: ". <(k3s completion bash)  # Added by k3s-ansible"

- name: Setup optional config file
  when: k3s_server_config_yaml is defined
  block:
    - name: Make config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        mode: "0755"
        state: directory

    - name: Copy config values
      ansible.builtin.copy:
        content: "{{ k3s_server_config_yaml }}"
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
      register: _server_config_result
