---
- name: Create k3s initialization directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/local/bin/k3s-init-scripts
    - /var/lib/rancher/k3s/init-markers
    - /var/lib/rancher/k3s/credentials
    - /var/log

# Written on EVERY build, not just debug. /etc/systemd/system is measured as a whole directory,
# so this drop-in is covered by RTMR3 either way — but shipping it on both means a flipped value
# is a CONTENT change with a manifest entry, which rtmr3-verify catches at boot and powers off on.
# Were it absent on production, adding it offline would only show up as a failed remote
# attestation, after the VM had already booted with the fail-closed poweroff disabled.
- name: Create k3s-post-start drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-post-start.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install k3s post-start debug drop-in (poweroff gate)
  ansible.builtin.copy:
    content: |
      # Debug builds stay up on a failed init script so it can be diagnosed over SSH;
      # production powers the VM off. Measured into RTMR3 — do not edit on the image.
      [Service]
      Environment=K3S_POST_START_DEBUG={{ 'true' if (debug_build | default(false) | bool) else 'false' }}
    dest: /etc/systemd/system/k3s-post-start.service.d/10-debug.conf
    owner: root
    group: root
    mode: '0644'

- name: Install k3s post-start script
  copy:
    src: k3s-post-start.sh
    dest: /usr/local/bin/k3s-post-start.sh
    owner: root
    group: root
    mode: '0755'
    backup: yes

- name: Install k3s post-start service
  ansible.builtin.template:
    src: k3s-post-start.service.j2
    dest: /etc/systemd/system/k3s-post-start.service
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify:
    - reload systemd

- name: Copy k3s initialization scripts
  copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/k3s-init-scripts/{{ item | basename }}"
    owner: root
    group: root
    mode: '0755'
    backup: yes
  with_fileglob:
    - "files/cluster-init/*.sh"

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: yes

# Keep service disabled for build, cleanup will enable for first boot
- name: Disable k3s-post-start service
  ansible.builtin.systemd:
    name: k3s-post-start
    enabled: no
    state: stopped