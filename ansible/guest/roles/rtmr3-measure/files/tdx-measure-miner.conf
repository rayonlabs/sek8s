# /etc/tdx-measure.conf — RTMR3 measurement path list (chutes-miner-vm)
#
# THIS FILE IS INTENTIONALLY STATIC.  The paths listed here are hardcoded in
# the role source (files/tdx-measure-miner.conf) and are NOT driven by Ansible
# variables so that they cannot be silently changed by inventory overrides.
# Third parties can reproduce the exact RTMR3 measurement chain by reading
# this file in the repository.
#
# This file is baked into the initramfs (covered by RTMR1) so the list of
# measured paths cannot be tampered with without changing RTMR1.
#
# Each non-blank, non-comment line names a file or directory to measure into
# TDX RTMR3 at boot.  Directories are walked recursively; all entries are
# sorted lexicographically before hashing to guarantee a deterministic extend
# chain regardless of filesystem ordering.
#
# Only regular files are measured.  Symlinks, sockets, pipes, and device nodes
# are skipped.  Missing paths contribute nothing to RTMR3.
#
# verify-access-config is intentionally absent from this image (not installed
# on chutes-miner-vm).  Use files/tdx-measure-gpu.conf for tee-gpu-vm.

# System access-control files
/etc/ssh
/etc/pam.d
/etc/passwd
/etc/shadow
/etc/sudoers
/etc/sudoers.d
/etc/default/grub
/root/.ssh

# PAM/auth-adjacent configs — prevent NSS redirection, login policy, shell tampering
/etc/nsswitch.conf
/etc/login.defs
/etc/shells
/etc/security

# Seccomp profiles — runtime syscall enforcement for k3s workloads
/var/lib/kubelet/seccomp

# rtmr3-verify environment file — must not exist on production builds.
# Defense-in-depth only: even if debug mode were enabled, the validator's
# RTMR3 check at attestation time is authoritative. Bypassing rtmr3-verify
# just delays the inevitable rejection — no workloads would deploy.
/etc/default/rtmr3-verify

# Post-bind-mount RTMR3 integrity check
/usr/local/bin/rtmr3-verify

# sek8s application source — installed at image build time
/opt/sek8s/src

# OPA admission-controller policies — installed at image build time
/etc/opa/policies

# k3s post-start runner and per-step scripts — installed at image build time
/usr/local/bin/k3s-post-start.sh
/usr/local/bin/k3s-init-scripts

# Path-restricted privileged remove wrapper — the system-manager sudoers grant
# points at this (instead of bare /usr/bin/rm). Measuring it ensures the binary
# that runs as root cannot be swapped on the root image without changing RTMR3.
/usr/local/bin/cache-rm

# Helm chart reconcile specs — the single source of truth for boot-time chart
# reconciliation (04-helm-chart-upgrade.sh). Measuring these ensures the pinned
# chart versions, values, and flags cannot be tampered with on the root image.
/etc/chutes/charts

# Storage bind-mount setup script — syncs root manifests into storage (rsync -ac).
# Measuring this script ensures any tamper to the sync logic is detectable.
/usr/local/bin/setup-storage-bind-mounts.sh

# k3s static manifests (source, on root filesystem).
# After boot, /var/lib/rancher/k3s/server/manifests is bind-mounted from storage.
# rsync -ac syncs root→storage unconditionally on every boot.  The watchdog
# verifies the storage copy matches the root measurement by recomputing the chain
# from the live (bind-mounted) path and comparing to hardware RTMR3.
#
# The webhook manifests bake a deterministic `caBundle: __ADMISSION_CA_BUNDLE__`
# placeholder so this measurement is reproducible across builds.  The real
# (ephemeral, per-VM) CA is substituted into the *storage* copy at boot by
# generate-admission-cert AFTER rtmr3-verify has confirmed the placeholder copy
# still matches this measurement — so the live caBundle is never measured.
/var/lib/rancher/k3s/server/manifests

# Admission-controller ephemeral-CA generator. This script runs as root each boot
# (after rtmr3-verify, before k3s applies the webhooks) to mint the per-VM admission
# CA and inject its caBundle into the measured-placeholder webhook manifests — so it
# is the trust anchor that decides which CA the admission webhook accepts. Measure
# the script (and its service ordering + debug flag) so none of them can be swapped
# on the root image without changing RTMR3, matching how every other privileged boot
# script (cache-rm, rtmr3-verify, k3s-post-start, setup-storage-bind-mounts) is
# measured. The CA/cert material it generates stays ephemeral and unmeasured (note
# below). The debug flag is absent on prod (contributes nothing); measuring it makes
# injecting GENERATE_ADMISSION_CERT_DEBUG_MODE=true on a prod image RTMR3-detectable.
/usr/local/bin/generate-admission-cert
/etc/systemd/system/generate-admission-cert.service
/etc/default/generate-admission-cert

# NOTE: /etc/admission-controller/certs is intentionally NOT measured.  The CA
# key/cert, the per-VM server cert, and the openssl.cnf used to mint them are all
# generated fresh at boot (ephemeral, never written to the root image) so a third
# party can reproduce this RTMR3 chain without access to any private key material.
# See generate-admission-cert.

# Service configuration — image resolution and admission policy.
# These files are fully deterministic at build time now that the registry hostname
# is static (registry.chutes.ai, reached over per-VM mTLS) and ALLOWED_VALIDATORS
# is not stored here. Measuring them prevents offline tampering with registry
# allowlists, cosign verification settings, or attestation endpoints.
#
# NOT measured and NOT on the root filesystem:
#   /run/chutes/validator-auth.env  — ALLOWED_VALIDATORS with per-boot ephemeral SS58.
#   Written by write-validator-auth (initramfs) to the /run tmpfs, which initramfs-tools moves
#   to the real root's /run before exec'ing init.  Fully ephemeral — cleared on every reboot.
/etc/system-manager/system-manager.env
/etc/admission-controller/admission-controller.env
/etc/admission-controller/cosign-registries.json
/etc/docker/daemon.json
/etc/hosts
/etc/fstab
/etc/tdx-luks.conf

# Admission controller configs.
# Cosign public keys are NOT measured here — trust is delegated to the RSA
# chain: RTMR3 attests /etc/chutes/root-signing-key.pem (via /etc/chutes/
# below) → root key verifies RSA signatures → RSA signatures authenticate
# the leaf cosign keys fetched at boot into /run/chutes/signing-keys/.
/etc/admission-controller/authorization-webhook-config.yaml
/etc/opa/opa.yaml

# Attestation service config and scripts
/etc/attestation-service/attestation-service.env
/etc/attestation-service/scripts

# Chute log shipper config: the validator URL logs egress to, the CRI endpoint pod
# metadata is read from, and the container/label names that decide which pods are
# captured at all. Every other sek8s service config is measured; this one was the
# omission.
/etc/chute-log-shipper

# Chutes service config
/etc/chutes

# Systemd unit files (all build-time static; runtime-generated units live
# in /run/systemd and are not covered here).
# /usr/lib/systemd/system contains the base unit templates (e.g. tmp.mount);
# /etc/systemd/system contains site-local overrides and drop-ins.
# Both must be measured: an attacker can suppress a tmpfs mount or enable a
# malicious service by modifying the template layer without touching /etc/.
/etc/systemd/system
/usr/lib/systemd/system

# ── AppArmor profiles (from apparmor-hardening role) ─────────────────────
/etc/apparmor.d/sek8s.system-manager
/etc/apparmor.d/sek8s.setup-cache
/etc/apparmor.d/sek8s.deny-sensitive-default
/etc/apparmor.d/sek8s.attestation-proxy
/etc/apparmor.d/sek8s.chute-log-shipper
/etc/apparmor.d/sek8s.k3s-init
/etc/apparmor.d/abstractions/sek8s-cache-deny
/etc/apparmor.d/abstractions/sek8s-secrets-deny
/etc/apparmor.d/abstractions/sek8s-shell-base
/usr/local/bin/verify-apparmor-profiles.sh

# ── Tier 1: Custom binaries ─────────────────────────────────────────────
/usr/local/bin
/usr/local/sbin

# ── Tier 2: Code injection config paths ─────────────────────────────────
/etc/ld.so.preload
/etc/ld.so.conf
/etc/ld.so.conf.d
/etc/modprobe.d
/etc/modules-load.d
/etc/sysctl.conf
/etc/sysctl.d
/etc/profile
/etc/profile.d
/etc/bash.bashrc
/etc/environment
/etc/crontab
/etc/cron.d
/var/spool/cron/crontabs

# SysV init compatibility — systemd on Ubuntu still runs these at boot
/etc/init.d
/etc/rc.local

# Root user shell startup — sourced on any root shell session (SSH, kubectl exec)
/root/.bashrc
/root/.bash_profile
/root/.profile

# ── Tier 3: System binaries and shared libraries ─────────────────────────
# These directories contain 1500+ files; progress logging in the rtmr3-measure
# initramfs script keeps miners informed during the extended measurement phase.
#
# /usr/lib is here because measuring the binaries without the libraries they load
# covers only half the executable surface: /usr/bin holds execve targets, /usr/lib
# holds the mmap-exec targets, and four AppArmor profiles grant `/usr/lib/** rm` to
# reach them. Kernel modules under it matter for their own reason — a tampered module
# is kernel-level code execution, and RTMR1/2 cover only the modules baked into the
# initramfs, not the ones on disk here.
#
# The whole tree rather than a curated subset (x86_64-linux-gnu, or a *.so glob): a
# subset is a filter someone has to keep correct, and it fails silently when a later
# image grows a directory nobody added to the list. Measured cost on a reference
# system is ~19s for ~27k files, against ~7s for the multiarch directory alone.
/usr/bin
/usr/sbin
/usr/local/lib
/usr/lib
