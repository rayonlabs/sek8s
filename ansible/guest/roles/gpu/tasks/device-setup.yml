---
- name: Check CUDA
  tags:
    - gpu-device-setup
  block:
    - name: Check CUDA installation
      ansible.builtin.apt:
        name: cuda-toolkit-{{ cuda_version }}
        state: present
      check_mode: true
      register: cuda_check
      ignore_errors: true

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: "y"

    - name: Get list of installed CUDA/NVIDIA packages
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          dpkg --list | egrep -i 'cuda|nvidia' | grep -v 'linux-nvidia' | awk '{print $2}' || true
        executable: /bin/bash
      register: nvidia_packages
      changed_when: false

    - name: Check whether target NVIDIA driver is already installed at pinned version
      ansible.builtin.shell:
        cmd: |
          if dpkg -s nvidia-dkms-open 2>/dev/null | grep -q "^Version: {{ nvidia_pkg_version }}"; then
            echo installed
          else
            echo missing
          fi
        executable: /bin/bash
      register: target_driver_installed
      changed_when: false

    - name: Remove old CUDA/NVIDIA packages
      ansible.builtin.apt:
        name: "{{ nvidia_packages.stdout_lines }}"
        state: absent
        allow_change_held_packages: true
      when:
        - manage_nvidia_drivers | default(true) | bool
        - not skip_cuda | bool
        - target_driver_installed.stdout == 'missing'
        - nvidia_packages.stdout_lines | length > 0
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: "y"

    - name: Purge old CUDA/NVIDIA packages
      ansible.builtin.command: dpkg --purge {{ item }}
      loop: "{{ nvidia_packages.stdout_lines }}"
      when:
        - manage_nvidia_drivers | default(true) | bool
        - not skip_cuda | bool
        - target_driver_installed.stdout == 'missing'
        - nvidia_packages.stdout_lines | length > 0
      failed_when: false
      changed_when: true

    # Adding this help mitigate lock conflicts when installing cuda keyring
    - name: Package environment cleanup
      block:
        - name: Check what's holding the dpkg lock
          shell: lsof /var/lib/dpkg/lock* 2>/dev/null || echo "No active locks"
          register: lock_holders
          changed_when: false

        - name: Display lock holders
          debug:
            var: lock_holders.stdout_lines

        - name: Wait for any existing package operations to complete
          shell: |
            timeout=300  # 5 minutes
            while [ $timeout -gt 0 ] && fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
              echo "Waiting for package lock to be released... ($timeout seconds remaining)"
              sleep 10
              timeout=$((timeout - 10))
            done
            if [ $timeout -le 0 ]; then
              echo "Timeout waiting for package lock"
              exit 1
            fi
          changed_when: false

    - name: Download and install CUDA keyring
      block:
        - name: Download keyring
          ansible.builtin.get_url:
            url: https://developer.download.nvidia.com/compute/cuda/repos/ubuntu{{ ubuntu_major }}{{ ubuntu_minor }}/x86_64/cuda-keyring_1.1-1_all.deb
            dest: /tmp/cuda-keyring.deb
            mode: "0644"
            owner: root
            group: root

        - name: Install keyring
          ansible.builtin.apt:
            deb: /tmp/cuda-keyring.deb

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Pin all NVIDIA/libnvidia packages to {{ nvidia_pkg_version }}
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nvidia-version-pin
        content: |
          Package: nvidia-* libnvidia-*
          Pin: version {{ nvidia_pkg_version }}
          Pin-Priority: 1001
        mode: "0644"

    - name: GPU Setup Tasks
      when:
        - manage_nvidia_drivers | default(true) | bool
        - not skip_cuda | bool
        - target_driver_installed.stdout == 'missing'
      block:
        - name: Stop NVIDIA services before upgrade (if present)
          ansible.builtin.systemd:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop:
            - nvidia-persistenced
            - nvidia-fabricmanager
          failed_when: false

        - name: Install CUDA toolkit
          ansible.builtin.apt:
            name: cuda-toolkit-{{ cuda_version }}
            state: present

        - name: Install DKMS prerequisites (kernel headers for module compilation)
          ansible.builtin.apt:
            name:
              - "linux-headers-{{ ansible_kernel }}"
              - dkms
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"

        # 595 uses unversioned package names from the CUDA repo. All libs and driver
        # packages are pinned to nvidia_pkg_version. No prebuilt kernel modules exist
        # for 595; DKMS compiles them at install time.
        - name: Install NVIDIA {{ nvidia_version }} libraries (unversioned, CUDA repo)
          ansible.builtin.apt:
            name:
              - libnvidia-cfg1={{ nvidia_pkg_version }}
              - libnvidia-common={{ nvidia_pkg_version }}
              - libnvidia-compute={{ nvidia_pkg_version }}
              - libnvidia-decode={{ nvidia_pkg_version }}
              - libnvidia-encode={{ nvidia_pkg_version }}
              - libnvidia-extra={{ nvidia_pkg_version }}
              - libnvidia-fbc1={{ nvidia_pkg_version }}
              - libnvidia-gl={{ nvidia_pkg_version }}
              - libnvidia-gpucomp={{ nvidia_pkg_version }}
              - nvidia-persistenced={{ nvidia_pkg_version }}
            install_recommends: false
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"

        - name: Install NVIDIA {{ nvidia_version }} DKMS driver stack
          ansible.builtin.apt:
            name:
              - nvidia-dkms-open={{ nvidia_pkg_version }}
              - nvidia-kernel-source-open={{ nvidia_pkg_version }}
              - nvidia-kernel-common={{ nvidia_pkg_version }}
              - nvidia-firmware={{ nvidia_pkg_version }}
              - nvidia-modprobe={{ nvidia_pkg_version }}
            install_recommends: false
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"
          register: driver_install
          changed_when: driver_install.changed

        - name: Install Fabric Manager, persistenced, modprobe, settings, and IMEX from CUDA repo
          ansible.builtin.apt:
            name:
              - nvidia-fabricmanager={{ nvidia_pkg_version }}
              - nvidia-persistenced={{ nvidia_pkg_version }}
              - nvidia-modprobe={{ nvidia_pkg_version }}
              - nvidia-settings={{ nvidia_pkg_version }}
              - nvidia-imex={{ nvidia_pkg_version }}
            install_recommends: false
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"

        - name: Install NVSwitch library (libnvidia-nscq)
          ansible.builtin.apt:
            name:
              - libnvidia-nscq={{ nvidia_pkg_version }}
            install_recommends: false
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"
          failed_when: false

        - name: Install NVIDIA Container Toolkit
          ansible.builtin.apt:
            name: nvidia-container-toolkit
            install_recommends: false
            state: present
            update_cache: true
          environment:
            DEBIAN_FRONTEND: noninteractive
            NEEDRESTART_SUSPEND: "y"

        - name: Verify DKMS module is built for running kernel
          ansible.builtin.shell:
            cmd: dkms status | grep -q "nvidia.*{{ ansible_kernel }}"
            executable: /bin/bash
          register: dkms_verify
          changed_when: false

        - name: Fail if DKMS module was not built for running kernel
          ansible.builtin.assert:
            that:
              - dkms_verify.rc == 0
            fail_msg: >-
              DKMS nvidia module not found for {{ ansible_kernel }}.
              The VM image will not have functional GPU drivers.
              Check: dkms status && dkms autoinstall

        - name: Configure NVIDIA Fabric Manager
          ansible.builtin.systemd:
            name: nvidia-fabricmanager
            enabled: true
            masked: false

        - name: Install nvidia-persistenced configuration script
          ansible.builtin.copy:
            src: nvidia-persistenced-config.sh
            dest: /usr/local/sbin/nvidia-persistenced-config.sh
            owner: root
            group: root
            mode: '0755'

        - name: Install nvidia-persistenced configuration service
          ansible.builtin.copy:
            src: nvidia-persistenced-config.service
            dest: /etc/systemd/system/nvidia-persistenced-config.service
            owner: root
            group: root
            mode: '0644'

        - name: Reload systemd after installing nvidia-persistenced config units
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Enable nvidia-persistenced configuration service
          ansible.builtin.systemd:
            name: nvidia-persistenced-config.service
            enabled: true
            state: stopped

        - name: Install nvidia-fabricmanager-mask script
          ansible.builtin.copy:
            src: nvidia-fabricmanager-mask.sh
            dest: /usr/local/sbin/nvidia-fabricmanager-mask.sh
            owner: root
            group: root
            mode: '0755'

        - name: Install nvidia-fabricmanager-mask service
          ansible.builtin.copy:
            src: nvidia-fabricmanager-mask.service
            dest: /etc/systemd/system/nvidia-fabricmanager-mask.service
            owner: root
            group: root
            mode: '0644'

        - name: Enable nvidia-fabricmanager-mask service
          ansible.builtin.systemd:
            name: nvidia-fabricmanager-mask.service
            enabled: true
            state: stopped

        - name: Reload systemd after installing nvidia-fabricmanager-mask
          ansible.builtin.systemd:
            daemon_reload: true

        # infiniband-config: always installed for all GPU topologies. At boot it detects
        # Mellanox devices and masks IB services only when absent (same image for B200/H200/etc).
        - name: Install infiniband-config script
          ansible.builtin.copy:
            src: infiniband-config.sh
            dest: /usr/local/sbin/infiniband-config.sh
            owner: root
            group: root
            mode: '0755'

        - name: Install infiniband-config service
          ansible.builtin.copy:
            src: infiniband-config.service
            dest: /etc/systemd/system/infiniband-config.service
            owner: root
            group: root
            mode: '0644'

        - name: Install infiniband-config service (disabled until cleanup enables at runtime)
          ansible.builtin.systemd:
            name: infiniband-config.service
            enabled: no
            state: stopped

        - name: Reload systemd after installing infiniband-config
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Create nvidia-fabricmanager override directory
          ansible.builtin.file:
            path: /etc/systemd/system/nvidia-fabricmanager.service.d
            state: directory
            mode: '0755'

        - name: Add dependency on nvidia-fabricmanager-mask for fabricmanager
          ansible.builtin.copy:
            dest: /etc/systemd/system/nvidia-fabricmanager.service.d/dependency.conf
            content: |
              [Unit]
              After=nvidia-persistenced-config.service nvidia-fabricmanager-mask.service
            mode: '0644'

        - name: Enable nvidia-persistenced for next boot
          ansible.builtin.systemd:
            name: nvidia-persistenced
            enabled: true
            state: stopped

        - name: Reboot if driver install updated kernel modules and reboot is requested
          ansible.builtin.reboot:
            reboot_timeout: 600
          when:
            - driver_install is defined
            - driver_install.changed
            - reboot_on_driver_upgrade | default(false) | bool

    # Always run: same VM image for all topologies (B200+IB, H200, etc).
    # Packages and ib_umad are installed; infiniband-config.service at boot
    # detects Mellanox devices and masks/disables only when absent.
    - name: InfiniBand Setup Tasks
      block:
        - name: Install InfiniBand diagnostics, rdma-core, and NVLSM
          ansible.builtin.apt:
            name:
              - infiniband-diags
              - rdma-core
              # Pinned via nvlsm_version: NVIDIA's "latest" can 404 when the
              # Packages index lists a version before its .deb is uploaded.
              - "nvlsm={{ nvlsm_version }}"
            state: present

        # NVSHMEM: GPU-to-GPU communication over PCIe/NVLink/InfiniBand.
        # Uses CUDA repo (keyring already installed). Match CUDA major from cuda_version.
        - name: Install NVSHMEM (NVIDIA Shared Memory) for InfiniBand GPUDirect
          ansible.builtin.apt:
            name:
              - "libnvshmem3-cuda-{{ cuda_version | split('-') | first }}"
              - "libnvshmem3-dev-cuda-{{ cuda_version | split('-') | first }}"
            state: present

        - name: Load ib_umad kernel module
          modprobe:
            name: ib_umad
            state: present

        - name: Make ib_umad module persistent
          lineinfile:
            path: /etc/modules
            line: "ib_umad"
            create: yes

        - name: Create NVLSM directory
          file:
            path: /usr/share/nvidia/nvlsm
            state: directory
            mode: '0755'

        - name: Create NVLSM configuration file
          file:
            path: /usr/share/nvidia/nvlsm/nvlsm.conf
            state: touch
            mode: '0644'

    - name: Configure file limits
      ansible.builtin.blockinfile:
        path: /etc/security/limits.conf
        block: |
          * soft nofile 40000
          * hard nofile 40001

    - name: Configure PAM limits
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        line: "session required pam_limits.so"
      with_items:
        - /etc/pam.d/common-session
        - /etc/pam.d/common-session-noninteractive

- name: Blacklist in-tree GPU drivers that race the NVIDIA driver
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-gpu-guest.conf
    content: |
      # On kernel 7.0+ the in-tree Rust nova_core (and nvidiafb/nouveau) match the
      # GPU PCI class and claim the passthrough GPUs before the 595 nvidia driver,
      # leaving them unbound (no /dev/nvidia0) so the NVLink fabric never completes
      # SOE/TNVL training. Mirror of the host blacklist (chutes_cvm.host.setup).
      blacklist nova_core
      blacklist nouveau
      blacklist nvidiafb
      options nouveau modeset=0
    mode: '0644'
    owner: root
    group: root
  notify: update initramfs

- name: Blacklist nvidia-drm module
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-nvidia-drm.conf
    content: |
      # Blacklist nvidia-drm for compute-only GPUs
      blacklist nvidia-drm
    mode: '0644'
    owner: root
    group: root
  notify: update initramfs
  register: nvidia_drm_blacklist
  when: blacklist_nvidia_drm | default(false) | bool

- name: Add NVIDIA LKCA preload drop-in
  block:
    - name: Check for existing nvidia-lkca.conf
      ansible.builtin.stat:
        path: /etc/modprobe.d/nvidia-lkca.conf
      register: nvidia_lkca_stat

    - name: Add NVIDIA LKCA preload drop-in (only if missing)
      copy:
        dest: /etc/modprobe.d/nvidia-lkca.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Ensures ECDSA/ECDH crypto modules load before nvidia.ko
          install nvidia /sbin/modprobe ecdsa_generic; /sbin/modprobe ecdh; /sbin/modprobe --ignore-install nvidia
      notify: update initramfs
      when: not nvidia_lkca_stat.stat.exists
  
- name: Add nvidia-tdx systemd unit
  block:
    - name: Ensure nvidia-tdx.service is present
      ansible.builtin.copy:
        dest: /lib/systemd/system/nvidia-tdx.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=TDX GPU setup
          After=nvidia-persistenced.service

          [Service]
          ExecStart=nvidia-smi conf-compute -srs 1

          [Install]
          WantedBy=multi-user.target

    - name: Enable nvidia-tdx service for first-boot (do not start now)
      ansible.builtin.systemd:
        name: nvidia-tdx
        enabled: true
        state: stopped

- name: Configure Docker NVIDIA Container Runtime
  tags:
    - gpu-device-setup
  block:
    # Defensive: guards against residual state on a REUSED build node, not a bug in
    # this pipeline. On a clean rootfs nothing creates an empty daemon.json — docker.io
    # ships none, and nvidia-ctk happily starts from an absent file. But nvidia-ctk
    # reads daemon.json before editing and aborts with "unable to load config for
    # runtime docker: EOF" when the file is 0 bytes / invalid JSON. That happens when a
    # prior run on the same long-lived build VM was interrupted mid-write (a shell
    # redirect truncates the target to 0 bytes before the writer runs). Normalize to
    # valid JSON here so the step is idempotent across rebuilds. TODO: revisit — the
    # real ordering smell is that admission-controller (which guarantees a valid
    # daemon.json) runs after the gpu role that first depends on it.
    - name: Ensure /etc/docker/daemon.json is valid JSON before nvidia-ctk
      ansible.builtin.shell: |
        mkdir -p /etc/docker
        if [ ! -s /etc/docker/daemon.json ] || ! python3 -c "import json,sys; json.load(open('/etc/docker/daemon.json'))" 2>/dev/null; then
          printf '{}\n' > /etc/docker/daemon.json
        fi
      changed_when: false

    - name: Configure NVIDIA Container Toolkit for Docker
      ansible.builtin.shell: |
        nvidia-ctk runtime configure --runtime=docker --set-as-default
      register: docker_runtime_configure
      changed_when: >
        docker_runtime_configure.stdout is search('changed|updated|modified') or
        docker_runtime_configure.stderr is search('changed|updated|modified')
