[Service]
# The fetched cosign public keys. Binds into the private tmpfs the base unit mounts
# over 0700 /run/chutes; the keys themselves are public (0644), so this is about reach,
# not secrecy. Optional (-): the initramfs mints the path at boot, so it is absent
# during the build, when admission-controller is also started.
BindReadOnlyPaths=-/run/chutes/signing-keys
