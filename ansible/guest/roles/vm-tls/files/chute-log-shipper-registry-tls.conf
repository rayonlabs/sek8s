[Unit]
# Order after the leaf-perms unit so the group grant is applied before the shipper
# opens its mTLS client identity. Soft (Wants/After): absent when the vm-tls role
# is not applied, leaving chute-log-shipper independently runnable.
After=registry-tls-config.service
Wants=registry-tls-config.path

[Service]
# Group-read on the root-owned leaf (0640, minted per boot); chute-log-shipper
# presents it as its log-egress mTLS identity.
SupplementaryGroups=registry-tls
