[Service]
# cosign presents the registry mTLS leaf to registry.chutes.ai via
# --registry-client-cert. Appends to SupplementaryGroups, which admission's 10-security
# resets; ordered last (40-) so this append survives.
SupplementaryGroups=registry-tls

# Binds into the private tmpfs the base unit mounts over 0700 /run/chutes. The group
# above is what then permits the 0640 key; the bind only makes the path reachable.
# Optional (-): absent during the build.
BindReadOnlyPaths=-/run/chutes/registry-tls
