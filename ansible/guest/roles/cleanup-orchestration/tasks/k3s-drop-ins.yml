---
- name: Mount restrictions setup
  block:
    - name: Ensure /cache directory exists
      ansible.builtin.file:
        path: /cache
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create systemd drop-in directory for k3s
      ansible.builtin.file:
        path: /etc/systemd/system/k3s.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Need to create this directory since it must exist for systemd restrictions to be valid
    - name: Create /etc/kubernetes directory for GPU opeartor
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy k3s mount restrictions drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/k3s-mount-restrictions.conf
        dest: /etc/systemd/system/k3s.service.d/mount-restrictions.conf
        owner: root
        group: root
        mode: "0644"

    - name: Copy k3s dependencies drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/dependencies.conf
        dest: /etc/systemd/system/k3s.service.d/dependencies.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy AppArmor verification dependency drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/apparmor-verify.conf
        dest: /etc/systemd/system/k3s.service.d/apparmor-verify.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy chroot restriction drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/chroot-restrictions.conf
        dest: /etc/systemd/system/k3s.service.d/chroot-restrictions.conf
        owner: root
        group: root
        mode: "0644"

    - name: Copy k3s mount dependency drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/k3s-mount.conf
        dest: /etc/systemd/system/k3s.service.d/k3s-mount.conf
        owner: root
        group: root
        mode: "0644"
      # This is added at runtime (cleanup phase) because the storage volume doesn't exist during build

    - name: Copy NVIDIA shutdown ordering drop-in
      ansible.builtin.copy:
        src: files/k3s.service.d/nvidia-ordering.conf
        dest: /etc/systemd/system/k3s.service.d/nvidia-ordering.conf
        owner: root
        group: root
        mode: "0644"

    - name: Copy no-restart drop-in (k3s crash requires full reboot)
      ansible.builtin.copy:
        src: files/k3s.service.d/no-restart.conf
        dest: /etc/systemd/system/k3s.service.d/no-restart.conf
        owner: root
        group: root
        mode: "0644"

    - name: Set sysctl parameters for mount security
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-mount-security.conf
        reload: true
      loop:
        - { name: "fs.protected_regular", value: "2" }
        - { name: "fs.protected_fifos", value: "2" }
        - { name: "fs.protected_symlinks", value: "1" }
        - { name: "fs.protected_hardlinks", value: "1" }