[Unit]
# Hard dependency: k3s must not start if verify-apparmor-profiles has not confirmed
# every sek8s profile is loaded in enforce mode. The verifier powers off on failure,
# so this Requires= is defence-in-depth — it structurally blocks k3s even if the
# poweroff path somehow fails to execute.
#
# It also anchors the verifier itself. Its only other activation is the
# multi-user.target.wants symlink, and RTMR3 measures regular files only
# (rtmr3-measure `find -type f`), so that symlink is unmeasured and deleting it
# would silently disable the check. This drop-in lives under /etc/systemd/system,
# which is measured.
Requires=verify-apparmor-profiles.service
After=verify-apparmor-profiles.service
