[Unit]
# Add setup-cache.service dependency at cleanup; omitted from base unit because
# cache volume (var-snap.mount) does not exist during build VM.
Wants=setup-cache.service

# system-manager runs confined by sek8s.system-manager, so it must not start
# unless the profiles actually loaded. Requires= also keeps the verifier reachable
# through a measured drop-in rather than only its unmeasured
# multi-user.target.wants symlink — see k3s.service.d/apparmor-verify.conf.
Requires=verify-apparmor-profiles.service
After=verify-apparmor-profiles.service
