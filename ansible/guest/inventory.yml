---
# inventory.yml
all:
  children:
    vm:
      hosts: # Dynamically populated by playbook
    host:
      hosts:
        localhost:
          ansible_connection: local

  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    # Root RSA PUBLIC key — baked into the image and measured into RTMR3. Fetched at build time
    # from R2 (not user-supplied). It is published from KMS out-of-band in chutes-ops
    # (`make export-signing-keys && make publish-signing-key`) — a manual prerequisite, NOT part of
    # the build (the build depends on it, so it can never upload it). root_signing_key_path is just
    # the build-local cache the fetch fills.
    root_signing_key_url: "https://vm.chutes.ai/root-signing-key.pem"
    root_signing_key_path: "/tmp/chutes-root-signing-key.pem"
    luks_passphrase: "{{ lookup('env', 'LUKS_PASSPHRASE') | mandatory }}"
    tdx_base_url: "https://cvm.chutes.ai"
    validator_base_url: "https://api.chutes.ai"
    build_env: "prod"
    prime_wait_timeout: 300

    debug_build: false
    # List of SSH public key strings for guest access (required when using tee-gpu-vm.yml)
    guest_ssh_keys: []
    # Optional: Override sek8s image tag for testing (default: "latest")
    # sek8s_image_tag: "dev-latest"
