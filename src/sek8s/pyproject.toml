[tool.poetry]
name = "sek8s"
version = "0.4.0"
description = "GPU infrastructure for Chutes miners and zero-trust workloads"
authors = ["Kyle Widmann <kyle@chutes.ai>"]
readme = "README.md"
packages = [{include = "sek8s"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
autoflake = "^2.3.1"
flask = "^3.1.1"
cryptography = "^45.0.4"
psutil = "^7.0.0"
aiohttp = "^3.12.15"
cachetools = "^6.1.0"
pydantic = "^2.11.7"
pydantic-settings = "^2.10.1"
loguru = "^0.7.3"
pytest-asyncio = "^1.2.0"
fastapi = ">=0.110.1,<0.111.0"
uvicorn = "^0.37.0"
nvidia-ml-py = "^13.580.82"
httpx = "^0.28.1"
orjson = "^3.11.3"
backoff = "^2.2.1"
bittensor = "^9.12.2"
substrate-interface = "^1.7.11"
aiocache = "^0.12.3"
huggingface_hub = "^1.18.0"
sek8s-common = {path = "../sek8s-common", develop = true}

[tool.poetry.scripts]
admission-controller = 'sek8s.services.admission_controller:run'
attestation-service = 'sek8s.services.attestation:run'
system-manager = 'sek8s.services.manager:run'
chute-log-shipper = 'sek8s.services.log_shipper:run'

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
